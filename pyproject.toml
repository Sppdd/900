[project]
name = "sandcoder"
version = "0.3.0"
description = "A panel of sandboxed specialist agents for your coding agent, on Nebius Token Factory Sandboxes"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "contree-sdk>=0.3.6",
    "contree-client[httpx]>=0.4.0",
    "openai>=1.40",
    "httpx>=0.27",
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sandcoder = "sandcoder.cli:main"
sandcoder-mcp = "sandcoder.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcoder"]
artifacts = ["src/sandcoder/skills/**/*.md", "src/sandcoder/skills/**/*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
