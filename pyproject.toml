[project]
name = "sandcoder"
version = "0.1.0"
description = "Coding agents that write, run, and test code in Nebius Token Factory Sandboxes"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "contree-sdk>=0.3.6",
    "contree-client[httpx]>=0.4.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sandcoder = "sandcoder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcoder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
